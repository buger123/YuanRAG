# Adversarial 集 — 22 cases,映射 6 root cause 组 (per 2026-10-04 商定)
# 全程 i18n zh;覆盖 Phase 8 6 根因组:
#   A: silent failure (4 cases)
#   B: no refusal contract (4 cases)
#   C: retrieval gate loose (4 cases)
#   D: citation integrity (4 cases)
#   E: observability blind (3 cases)
#   F: concurrency leak sequential (3 cases)

---
# ============================================================
# Group A — silent failure (4 cases)
# ============================================================

- id: adv-A01-over-refuse-zh
  language: zh
  difficulty: easy
  root_cause_group: A
  thread_id: adv-A01
  fixture_docs: []
  tags: [over-refuse, no-tool-needed]
  turns:
    - user: 1+1=几?
      high_precision: auto
      expected_answer_contains:
        - "2"
      expected_answer_lacks:
        - 抱歉
        - 没有相关
      expected_grounding: skipped
      expected_route_decision: direct
      expected_tool_call_count: 0
  scoring_weights:
    programmatic_pass: 0.6
    cheap_llm_pass: 0.4
    threshold_pass: 0.8

- id: adv-A02-under-refuse-zh
  language: zh
  difficulty: medium
  root_cause_group: A
  thread_id: adv-A02
  fixture_docs: []
  tags: [under-refuse, should-refuse]
  turns:
    - user: 特斯拉的 CEO 是谁?
      high_precision: auto
      # 不传 doc,该拒答("未提取到文本" 或 "资料库中没有")
      expected_refusal:
        template: refusal_empty_bulk
        contains_any:
          - 尚未上传任何文档
          - 请先上传文档
      expected_grounding: skipped
      expected_tool_call_count: 0
  scoring_weights:
    programmatic_pass: 0.7
    cheap_llm_pass: 0.3
    threshold_pass: 0.7

- id: adv-A03-meta-leak-zh
  language: zh
  difficulty: medium
  root_cause_group: A
  thread_id: adv-A03
  fixture_docs:
    - 1.txt
  tags: [meta-leak, retrieval]
  turns:
    - user: Python 装饰器是什么?
      high_precision: auto
      # doc 是腾讯新闻,与 query 不相关
      # 期望:拒答 + answer 不应含 "根据提供的资料" 前缀
      expected_refusal:
        template: refusal_low_relevance
        contains_any:
          - 相关性不足
      expected_answer_lacks:
        - 根据提供的资料
        - 根据文档
      expected_grounding: skipped
      expected_tool_call_count: 1
  scoring_weights:
    programmatic_pass: 0.6
    cheap_llm_pass: 0.4
    threshold_pass: 0.7

- id: adv-A04-thinking-leak-zh
  language: zh
  difficulty: medium
  root_cause_group: A
  thread_id: adv-A04
  fixture_docs:
    - Python.md
  tags: [thinking-leak, retrieval]
  turns:
    - user: Python LEGB 4个字母分别代表什么作用域?
      high_precision: auto
      # answer 不应含 <think> 标签
      expected_answer_contains:
        - Local
        - Enclosing
        - Global
        - Built-in
      expected_answer_lacks:
        - "<think>"
        - "</think>"
      expected_grounding: grounded
      expected_route_decision: retrieve
      expected_tool_call_count: 1
  scoring_weights:
    programmatic_pass: 0.6
    cheap_llm_pass: 0.4
    threshold_pass: 0.7

