# ============================================================
# Group D — citation integrity (4 cases)
# ============================================================

- id: adv-D01-no-sources-zh
  language: zh
  difficulty: medium
  root_cause_group: D
  thread_id: adv-D01
  fixture_docs:
    - 1.txt
  tags: [missing-citation, retrieval]
  turns:
    - user: 腾讯音乐发债多少钱?
      high_precision: auto
      expected_answer_contains:
        - "10"
        - 亿美元
      # 期望 sources 存在,但我们故意 expected_citations=[] 让 checker
      # 期望"有引用且引用包含某 chunk_id" — 这种 case 期望 sources 存在
      # 因此 expected_citations 不应给空
      expected_grounding: grounded
      expected_route_decision: retrieve
      expected_tool_call_count: 1
  scoring_weights:
    programmatic_pass: 0.5
    cheap_llm_pass: 0.5
    threshold_pass: 0.6

- id: adv-D02-wrong-chunk-zh
  language: zh
  difficulty: medium
  root_cause_group: D
  thread_id: adv-D02
  fixture_docs:
    - 1.txt
  tags: [wrong-citation]
  turns:
    - user: 腾讯音乐发债多少钱?
      high_precision: auto
      expected_answer_contains:
        - "10"
        - 亿美元
      # 期望引用一个不存在的 chunk_id — 应 fail(找不到匹配 chunk)
      expected_citations:
        - nonexistent_doc_id_zzz
      expected_grounding: grounded
      expected_route_decision: retrieve
      expected_tool_call_count: 1
  scoring_weights:
    programmatic_pass: 0.5
    cheap_llm_pass: 0.5
    threshold_pass: 0.6

- id: adv-D03-source-mismatch-zh
  language: zh
  difficulty: medium
  root_cause_group: D
  thread_id: adv-D03
  fixture_docs:
    - Python.md
  tags: [wrong-citation, source-mismatch]
  turns:
    - user: Python LEGB 4个字母分别代表什么?
      high_precision: auto
      expected_answer_contains:
        - Local
        - Enclosing
        - Global
        - Built-in
      # 期望引用错 section(关于生成器而非作用域)
      expected_citations:
        - generator_section_wrong_xyz
      expected_grounding: grounded
      expected_route_decision: retrieve
      expected_tool_call_count: 1
  scoring_weights:
    programmatic_pass: 0.5
    cheap_llm_pass: 0.5
    threshold_pass: 0.6

- id: adv-D04-multi-doc-wrong-zh
  language: zh
  difficulty: medium
  root_cause_group: D
  thread_id: adv-D04
  fixture_docs:
    - 1.txt
    - Python.md
  tags: [multi-doc, wrong-citation]
  turns:
    - user: 腾讯音乐发债
      high_precision: auto
      # 上传 2 个 doc,期望引用 1.txt 而不是 Python.md
      # 因此 expected_citations 指向不存在于任何 doc 的 id
      expected_citations:
        - wrong_doc_chunk_999
      expected_grounding: grounded
      expected_route_decision: retrieve
      expected_tool_call_count: 1
  scoring_weights:
    programmatic_pass: 0.5
    cheap_llm_pass: 0.5
    threshold_pass: 0.6

