# ============================================================
# Group F — concurrency leak sequential (3 cases)
# ============================================================

- id: adv-F01-thread-pollution-zh
  language: zh
  difficulty: hard
  root_cause_group: F
  thread_id: adv-F01
  fixture_docs:
    - 1.txt
  tags: [thread-pollution, multi-turn]
  turns:
    - user: 苹果公司发布了一个水果产品叫 iPhone
      high_precision: auto
      # turn 1:user 提供无关 context "苹果"
      expected_grounding: skipped
      expected_route_decision: direct
      expected_tool_call_count: 0
    - user: 王者荣耀发生什么了?
      high_precision: auto
      # turn 2:期望 answer 不 leak "苹果" / "iPhone"
      expected_answer_contains:
        - 王者荣耀
        - 高校认证
      expected_answer_lacks:
        - 苹果
        - iPhone
        - 水果
      expected_grounding: grounded
      expected_route_decision: retrieve
      expected_tool_call_count: 1
  scoring_weights:
    programmatic_pass: 0.6
    cheap_llm_pass: 0.4
    threshold_pass: 0.7

