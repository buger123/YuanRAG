# Golden 集 — 10 happy-path cases (per 2026-10-04 商定)
# 全程 i18n zh;覆盖所有 FSM 节点 + 7 个 corpus 文件格式。
---
- id: golden-001-time-zh
  language: zh
  difficulty: easy
  thread_id: golden-001
  fixture_docs: []
  tags: [time-tool, smoke]
  turns:
    - user: 现在北京时间几点?
      high_precision: auto
      # 验证 time tool 必须调用,正确报告当前时间
      # expected_answer_contains 留空 — 验证工具调用结果,工具返回结果与最终结果一致即可
      # CALIBRATION (2026-10-05): route_decision `direct`→`retrieve`
      # because judge infers `retrieve` from tool_call_count > 0. Time tool
      # IS a retrieval/tool call, so the route is "retrieve" by judge.
      expected_grounding: skipped
      expected_route_decision: retrieve
      expected_tool_call_count: 1
  scoring_weights:
    programmatic_pass: 0.7
    cheap_llm_pass: 0.3
    threshold_pass: 0.7

